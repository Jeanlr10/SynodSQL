name: Release

# Builds the libraries for every platform: Python wheels (synodsql), the C
# library with synod.h and synod.hpp (libsynod), and the Rust crates.
#
# On a tag v<version> (the workspace version), it also makes a GitHub
# release with the wheels and C libraries, and publishes:
#   - to PyPI, if the repository variable PUBLISH_PYPI is "true" (trusted
#     publishing: add this workflow and the "pypi" environment on PyPI);
#   - to crates.io, if PUBLISH_CRATES is "true" (secret CARGO_REGISTRY_TOKEN).
# Run it by hand (Actions > Release > Run workflow) to build without
# releasing.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF#refs/tags/v}" != "$version" ]]; then
            echo "tag ${GITHUB_REF#refs/tags/} does not match the workspace version $version" >&2
            exit 1
          fi

  wheels:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64, test: true }
          - { os: ubuntu-24.04-arm, target: aarch64, test: true }
          - { os: macos-latest, target: aarch64, test: true }
          - { os: macos-latest, target: x86_64, test: false }
          - { os: windows-latest, target: x64, test: true }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: "2_28"
          args: --release --locked --out dist -m crates/synodsql-py/Cargo.toml
      - name: Test the wheel
        if: matrix.test
        shell: bash
        run: |
          python -m pip install pytest
          python -m pip install --no-index --find-links dist synodsql
          cd dist && python -m pytest -q ../crates/synodsql-py/tests
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.target }}
          path: dist/*.whl

  sdist:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist -m crates/synodsql-py/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  clib:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, name: linux-x86_64 }
          - { os: ubuntu-24.04-arm, name: linux-aarch64 }
          - { os: macos-latest, name: macos-aarch64 }
          - { os: windows-latest, name: windows-x86_64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build libsynod
        shell: bash
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            export RUSTFLAGS="-C link-arg=-Wl,-install_name,@rpath/libsynod.dylib"
          fi
          cargo build --release --locked -p synodsql-ffi
      - name: Test (C and C++)
        if: runner.os != 'Windows'
        run: scripts/test-bindings.sh --no-python
      - name: Package
        shell: bash
        run: |
          pkg="synod-${{ needs.version.outputs.version }}-${{ matrix.name }}"
          mkdir -p "$pkg/include" "$pkg/lib"
          cp crates/synodsql-ffi/include/synod.h crates/synodsql-ffi/include/synod.hpp "$pkg/include/"
          cp LICENSE-MIT LICENSE-APACHE "$pkg/"
          for f in libsynod.a libsynod.so libsynod.dylib synod.dll synod.dll.lib synod.lib; do
            if [ -f "target/release/$f" ]; then cp "target/release/$f" "$pkg/lib/"; fi
          done
          tar czf "$pkg.tar.gz" "$pkg"
      - uses: actions/upload-artifact@v4
        with:
          name: clib-${{ matrix.name }}
          path: synod-*.tar.gz

  crates:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Package the crates
        run: cargo publish --dry-run --locked -p synod-core -p synod-store -p synod-node -p synod-net -p synodsql -p synod-cli

  github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, wheels, sdist, clib, crates]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  pypi:
    if: startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_PYPI == 'true'
    needs: [wheels, sdist, crates]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "{wheel-*,sdist}"
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1

  crates-io:
    if: startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_CRATES == 'true'
    needs: [wheels, clib, crates]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo publish --locked -p synod-core -p synod-store -p synod-node -p synod-net -p synodsql -p synod-cli
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
