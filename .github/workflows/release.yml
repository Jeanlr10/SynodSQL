name: Release

# Builds the synod command and the libraries for every platform: synod
# binaries, Python wheels (synodsql), the C library with synod.h and
# synod.hpp (libsynod), and the Rust crates.
#
# On a tag v<version> (the workspace version), it also makes a GitHub
# release with the binaries, wheels, and C libraries (and SHA256SUMS), and
# publishes:
#   - to PyPI, if the repository variable PUBLISH_PYPI is "true" (trusted
#     publishing: add this workflow and the "pypi" environment on PyPI);
#   - to crates.io, if PUBLISH_CRATES is "true" (secret CARGO_REGISTRY_TOKEN).
# Run it by hand (Actions > Release > Run workflow) to build without
# releasing.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF#refs/tags/v}" != "$version" ]]; then
            echo "tag ${GITHUB_REF#refs/tags/} does not match the workspace version $version" >&2
            exit 1
          fi

  wheels:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64, test: true }
          - { os: ubuntu-24.04-arm, target: aarch64, test: true }
          - { os: macos-latest, target: aarch64, test: true }
          - { os: macos-latest, target: x86_64, test: false }
          - { os: windows-latest, target: x64, test: true }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: "2_28"
          args: --release --locked --out dist -m crates/synodsql-py/Cargo.toml
      - name: Test the wheel
        if: matrix.test
        shell: bash
        run: |
          python -m pip install pytest
          python -m pip install --no-index --find-links dist synodsql
          cd dist && python -m pytest -q ../crates/synodsql-py/tests
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.target }}
          path: dist/*.whl

  sdist:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist -m crates/synodsql-py/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  clib:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, name: linux-x86_64 }
          - { os: ubuntu-24.04-arm, name: linux-aarch64 }
          - { os: macos-latest, name: macos-aarch64 }
          - { os: windows-latest, name: windows-x86_64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build libsynod
        shell: bash
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            export RUSTFLAGS="-C link-arg=-Wl,-install_name,@rpath/libsynod.dylib"
          fi
          cargo build --release --locked -p synodsql-ffi
      - name: Test (C and C++)
        if: runner.os != 'Windows'
        run: scripts/test-bindings.sh --no-python
      - name: Package
        shell: bash
        run: |
          pkg="libsynod-${{ needs.version.outputs.version }}-${{ matrix.name }}"
          mkdir -p "$pkg/include" "$pkg/lib"
          cp crates/synodsql-ffi/include/synod.h crates/synodsql-ffi/include/synod.hpp "$pkg/include/"
          cp LICENSE-MIT LICENSE-APACHE "$pkg/"
          for f in libsynod.a libsynod.so libsynod.dylib synod.dll synod.dll.lib synod.lib; do
            if [ -f "target/release/$f" ]; then cp "target/release/$f" "$pkg/lib/"; fi
          done
          tar czf "$pkg.tar.gz" "$pkg"
      - uses: actions/upload-artifact@v4
        with:
          name: clib-${{ matrix.name }}
          path: libsynod-*.tar.gz

  cli:
    # The synod command. Linux binaries are static (musl), so they run on
    # any distribution; the Windows one has a static C runtime.
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, name: linux-x86_64, test: true }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, name: linux-aarch64, test: true }
          - { os: macos-latest, target: aarch64-apple-darwin, name: macos-aarch64, test: true }
          - { os: macos-latest, target: x86_64-apple-darwin, name: macos-x86_64, test: false }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, name: windows-x86_64, test: true }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build synod
        shell: bash
        run: |
          case "${{ matrix.target }}" in
            *-linux-musl) export TARGET_CC=musl-gcc ;;
            *-windows-msvc) export RUSTFLAGS="-C target-feature=+crt-static" ;;
          esac
          cargo build --release --locked -p synod-cli --target ${{ matrix.target }}
      - name: Test synod
        if: matrix.test
        shell: bash
        run: |
          bin="$PWD/target/${{ matrix.target }}/release/synod"
          "$bin" --version
          dir=$(mktemp -d) && cd "$dir"
          "$bin" init a.db --node 1
          "$bin" create-table a.db "CREATE TABLE stock (sku TEXT UNIQUE, qty INTEGER MERGE delta)"
          "$bin" insert a.db stock sku=A-100 qty=800
          out=$("$bin" query a.db "SELECT sku, qty FROM stock")
          [[ "$out" == *"A-100  800"* ]] || { echo "$out"; exit 1; }
          "$bin" certs certs --nodes 1 --hosts 1=127.0.0.1
          if [[ "${{ matrix.target }}" == *-linux-musl ]]; then
            file "$bin" | grep -Eq "statically linked|static-pie"
          fi
      - name: Package
        shell: bash
        run: |
          pkg="synod-${{ needs.version.outputs.version }}-${{ matrix.name }}"
          mkdir "$pkg"
          cp README.md LICENSE-MIT LICENSE-APACHE "$pkg/"
          if [ "$RUNNER_OS" = Windows ]; then
            cp "target/${{ matrix.target }}/release/synod.exe" "$pkg/"
            7z a "$pkg.zip" "$pkg" > /dev/null
          else
            cp "target/${{ matrix.target }}/release/synod" "$pkg/"
            tar czf "$pkg.tar.gz" "$pkg"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.name }}
          path: |
            synod-*.tar.gz
            synod-*.zip

  crates:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Package the crates
        run: cargo publish --dry-run --locked -p synod-core -p synod-store -p synod-node -p synod-net -p synodsql -p synod-cli

  github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, cli, wheels, sdist, clib, crates]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            **The synod command:** `synod-<version>-<platform>.tar.gz` (`.zip` on Windows) holds one binary with no dependencies; Linux builds are static. Unpack it and run `synod --help`. Check downloads against `SHA256SUMS` (`sha256sum -c SHA256SUMS --ignore-missing`). The `macos-x86_64` binary is built but not tested in CI.

            **Libraries:** Python wheels (`pip install synodsql-*.whl`) and the C library with `synod.h` and `synod.hpp` (`libsynod-<version>-<platform>.tar.gz` with `include/` and `lib/`).

  pypi:
    if: startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_PYPI == 'true'
    needs: [wheels, sdist, crates]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "{wheel-*,sdist}"
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1

  crates-io:
    if: startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_CRATES == 'true'
    needs: [wheels, clib, crates]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo publish --locked -p synod-core -p synod-store -p synod-node -p synod-net -p synodsql -p synod-cli
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
