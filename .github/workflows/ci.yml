name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked

  test:
    # x86-64 and ARM64: the pinned hash vectors must pass on both.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace --locked

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - run: cargo check --workspace --all-targets --locked

  simulation:
    # More seeds and property cases than the normal test run.
    runs-on: ubuntu-latest
    env:
      SYNOD_SIM_RUNS: 300
      PROPTEST_CASES: 2000
      # Phase 2 exit gate: 100,000 random merge histories.
      SYNOD_MERGE_RUNS: 100000
      # Phase 3 exit gate: 5 nodes for 10,000 epochs, 50 nodes for 300
      # epochs, and random clusters of 5 to 12 nodes.
      SYNOD_GATE_EPOCHS: 10000
      SYNOD_GATE50_EPOCHS: 300
      SYNOD_CLUSTER_RUNS: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace --release --locked
