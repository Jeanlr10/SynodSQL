[package]
name = "synodsql-py"
description = "SynodSQL for Python: the synodsql module"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]
# The module links to Python only when maturin builds it.
test = false
doctest = false

[dependencies]
synodsql.workspace = true
pyo3 = { version = "0.29", features = ["abi3-py39"] }

[lints.rust]
missing_docs = "allow"
