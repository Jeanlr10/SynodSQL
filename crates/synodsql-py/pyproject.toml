[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "synodsql"
description = "A git-style replicated SQL database for a small group of trusted servers"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT OR Apache-2.0" }
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Database :: Database Engines/Servers",
]
dynamic = ["version"]

[project.urls]
Repository = "https://github.com/Jeanlr10/SynodSQL"

[tool.maturin]
module-name = "synodsql._native"
python-source = "python"
features = ["pyo3/extension-module"]
