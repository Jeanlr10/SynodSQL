[package]
name = "synod-net"
description = "SynodSQL network transport: HTTP/2 with mutual TLS between member nodes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
synod-core.workspace = true
synod-store.workspace = true
synod-node.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "macros", "sync"] }
hyper = { version = "1", features = ["http1", "http2", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto"] }
serde_json = "1"
base64 = "0.22"
rusqlite.workspace = true
http-body-util = "0.1"
bytes = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = ["ring", "std"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }

[lints]
workspace = true
