[workspace]
resolver = "3"
members = ["crates/synod-core", "crates/synod-sim", "crates/synod-store"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Jeanlr10/SynodSQL"

[workspace.dependencies]
synod-core = { path = "crates/synod-core" }
synod-sim = { path = "crates/synod-sim" }
blake3 = "1.8"
proptest = "1.12"
rusqlite = { version = "0.40", features = ["bundled"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
